
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxWizard IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Redefining 'deep' to be compatible with light mode structures if missed, 
              // but we will mainly use standard colors.
              deep: {
                900: '#f8fafc', // Very light gray (Background)
                800: '#ffffff', // White (Panels)
                700: '#e2e8f0', // Borders
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc; /* Slate-50 */
        color: #1e293b; /* Slate-800 */
      }
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      /* Scrollbar styling for Light Mode */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Markdown Preview Styles for Light Screen */
      .prose-styles {
        color: #334155; /* slate-700 */
        line-height: 1.7;
      }
      .prose-styles h1, .prose-styles h2, .prose-styles h3 {
        color: #0f172a; /* slate-900 */
      }
      .prose-styles h3 {
        font-size: 1.25rem; 
        font-weight: 600; 
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #e2e8f0; 
        color: #2563eb; /* Blue-600 */
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .prose-styles ul, .prose-styles ol {
        margin-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .prose-styles ul { list-style-type: disc; marker: #2563eb; }
      .prose-styles ol { list-style-type: decimal; }
      .prose-styles li {
        margin-bottom: 0.5rem;
      }
      .prose-styles p {
        margin-bottom: 1rem;
      }
      .prose-styles a {
        color: #2563eb; 
        text-decoration: none;
      }
      .prose-styles a:hover {
        text-decoration: underline;
      }
      .prose-styles strong {
        font-weight: 700;
        color: #0f172a;
      }
      .prose-styles code {
        background-color: #f1f5f9; 
        color: #7c3aed; /* Violet-600 */
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.9em;
        border: 1px solid #e2e8f0;
      }
      .prose-styles pre {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0; 
        border-radius: 0.5rem;
        padding: 1rem;
        overflow-x: auto;
        margin-bottom: 1rem;
      }
      .prose-styles pre code {
        background-color: transparent;
        padding: 0;
        border: none;
        color: #334155;
      }
      .prose-styles blockquote {
        border-left: 4px solid #2563eb;
        padding-left: 1rem;
        margin-left: 0;
        font-style: italic;
        color: #475569; 
        background: #eff6ff; /* blue-50 */
        padding: 0.5rem 1rem;
        border-radius: 0 4px 4px 0;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0",
    "react-markdown": "https://esm.sh/react-markdown@9?deps=react@^19.1.1",
    "remark-gfm": "https://esm.sh/remark-gfm@4",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
</head>
<body class="bg-gray-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
